<!--

  Si apre, parte un conto alla rovescia di 3 secondi e il premio esce da solo.
  Il premio lo sceglie il server (supabase/14-fortuna.sql nel progetto degli agenti:
  fortuna_gioca), uno a sera per telefono; per riscattarlo si entra nel Club del Vico
  (menu ?club=apri): club.js lo mette nella tessera, che vale solo stasera e ha il suo QR.
  Il sabato e nei giorni di chiusura del Club la fortuna riposa.
  Prova senza toccare i dati veri: fortuna.html?demo=1

<style>

html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-testo);background:var(--bg);color:var(--crema);min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(ellipse at 50% -10%, rgba(230,178,74,.16), transparent 60%);}
.pagina{max-width:440px;margin:0 auto;padding:max(18px, env(safe-area-inset-top)) 18px 28px;text-align:center}

/* --- testa --- */
.testa{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px}
.testa img{width:58px;height:auto}
.testa .nome{font-family:var(--f-titoli);font-weight:600;font-size:1.45rem;letter-spacing:.02em;line-height:1;text-align:left}
.testa .nome small{display:block;margin-top:5px;font-weight:500;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--oro)}
h1{margin:18px 0 4px;font-family:var(--f-corsivo);font-style:italic;font-weight:600;font-size:2.3rem;color:var(--oro-tenue);line-height:1.1}
.sotto{color:var(--tenue);font-size:.92rem}

/* --- il palco del conto alla rovescia --- */
.palco{position:relative;width:260px;height:260px;margin:22px auto 6px}
.alone{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle, rgba(230,178,74,.32), transparent 65%);
  animation:respira 1s ease-in-out infinite}
@keyframes respira{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.06);opacity:1}}
.orbita{position:absolute;inset:0;animation:gira 2.4s linear infinite}
.orbita span{position:absolute;left:50%;top:50%;font-size:1.7rem;line-height:1;margin:-.85rem 0 0 -.85rem}
@keyframes gira{to{transform:rotate(360deg)}}
.palco.veloce .orbita{animation-duration:.9s}
.palco.velocissimo .orbita{animation-duration:.45s}
.anello{position:absolute;left:50%;top:50%;width:190px;height:190px;margin:-95px 0 0 -95px}
.anello circle{fill:none;stroke-width:7}
.anello .fondo{stroke:rgba(230,178,74,.18)}
.anello .giro{stroke:var(--oro);stroke-linecap:round;stroke-dasharray:578;stroke-dashoffset:578;transform:rotate(-90deg);transform-origin:50% 50%}
.anello .giro.va{animation:riempi 1s linear forwards}
@keyframes riempi{to{stroke-dashoffset:0}}
.numero{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-titoli);font-weight:600;font-size:6.4rem;color:var(--crema);text-shadow:0 0 30px rgba(230,178,74,.55)}
.numero.salta{animation:salta .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes salta{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
.palco.scoppia .anello,.palco.scoppia .numero{animation:via .45s ease-in forwards}
.palco.scoppia .orbita span{transition:transform .5s ease-in, opacity .5s ease-in;opacity:0}
@keyframes via{to{transform:scale(1.8);opacity:0}}
.didascalia{font-family:var(--f-titoli);font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;color:var(--oro)}

/* --- il premio --- */
.premio{margin-top:20px;padding:26px 20px 22px;border-radius:24px;background:linear-gradient(160deg,#30211b,var(--carta));
  border:1px solid rgba(230,178,74,.55);box-shadow:0 20px 50px rgba(0,0,0,.45),0 0 0 4px rgba(230,178,74,.08);
  animation:entra .6s cubic-bezier(.2,1.3,.4,1) both}
@keyframes entra{from{transform:translateY(30px) scale(.9);opacity:0}}
.premio .vinto{font-family:var(--f-titoli);font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:.85rem;color:var(--oro)}
.premio .emo{font-size:5rem;line-height:1.1;margin:10px 0 6px;display:inline-block;animation:rimbalza 1.2s ease-in-out .5s 2}

.premio .vale{display:inline-block;margin-top:14px;padding:6px 14px;border-radius:999px;background:rgba(200,16,46,.16);
  border:1px solid rgba(200,16,46,.45);color:#ffb3b3;font-size:.82rem;font-weight:500}
.premio .gia{margin-bottom:6px;color:var(--tenue);font-size:.85rem}

/* --- come si riscatta --- */
.riscatto{margin-top:16px;padding:18px 18px 20px;border-radius:20px;background:rgba(0,0,0,.25);border:1px dashed rgba(230,178,74,.5)}
.riscatto h3{font-family:var(--f-titoli);font-weight:600;font-size:1.15rem;letter-spacing:.03em;color:var(--oro-tenue)}

.riscatto.fatto{border-style:solid;border-color:rgba(134,182,74,.6);background:rgba(134,182,74,.08)}
.riscatto.fatto h3{color:#bfe39a}
.btn{display:block;width:100%;margin-top:14px;padding:17px 20px;border:0;border-radius:16px;cursor:pointer;text-decoration:none;
  font-family:var(--f-titoli);font-weight:600;font-size:1.08rem;letter-spacing:.1em;text-transform:uppercase;

@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.btn-vuoto{background:transparent;color:var(--crema);border:1px solid var(--linea);box-shadow:none}

/* --- messaggi (sere senza gioco, rete) --- */
.avviso{margin-top:28px;padding:30px 20px;border-radius:22px;background:var(--carta);border:1px solid var(--linea)}
.avviso .emo{font-size:3.4rem}
.avviso h2{margin-top:8px;font-family:var(--f-titoli);font-weight:600;font-size:1.5rem}
.avviso p{margin-top:6px;color:var(--tenue);font-size:.92rem}
.carico{margin:60px auto;width:46px;height:46px;border-radius:50%;border:4px solid rgba(230,178,74,.2);border-top-color:var(--oro);animation:gira .8s linear infinite}

/* --- in fondo --- */
.info{margin-top:28px;padding:18px;border-radius:18px;background:rgba(0,0,0,.2);border:1px solid var(--linea);color:var(--tenue);font-size:.84rem;line-height:1.75}
.info a{color:var(--oro);text-decoration:none}
.menu-btn{margin-top:18px}
footer{margin-top:20px;color:#6d5a4c;font-size:.75rem}

.coriandoli{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.coriandoli i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:cade 2.8s ease-in forwards}
@keyframes cade{to{transform:translateY(110vh) rotate(720deg)}}

@media (prefers-reduced-motion: reduce){
  .alone,.orbita,.btn.pulsa,.premio .emo{animation:none}
  .numero.salta,.premio{animation-duration:.01s}
}
</style>
</head>

      em.map(function (e, i) {
        const a = i / em.length * 2 * Math.PI;
        return '<span style="transform:translate(' + Math.round(Math.cos(a) * 118) + "px," + Math.round(Math.sin(a) * 118) + 'px)">' + e + "</span>";
      }).join("") + "</div>" +
      '<svg class="anello" viewBox="0 0 200 200" aria-hidden="true"><circle class="fondo" cx="100" cy="100" r="92"/>' +
      '<circle class="giro" cx="100" cy="100" r="92"/></svg><div class="numero" id="numero"></div></div>' +
      '<p class="didascalia">' + esc(t("gira")) + "</p>";
    const palco = $("#palco"), numero = $("#numero"), giro = palco.querySelector(".giro");
    for (const n of [3, 2, 1]) {
      numero.textContent = n;
      numero.classList.remove("salta"); void numero.offsetWidth; numero.classList.add("salta");
      giro.classList.remove("va"); void giro.getBoundingClientRect(); giro.classList.add("va");
      palco.classList.toggle("veloce", n === 2);
      palco.classList.toggle("velocissimo", n === 1);
      vibra(n === 1 ? 60 : 30);
      await pausa(1000);
    }
    palco.classList.add("scoppia");
    palco.querySelectorAll(".orbita span").forEach(function (s) { s.style.transform += " scale(2.4)"; });
    vibra([40, 60, 120]);
    await pausa(420);
  }

  function coriandoli() {
    const c = document.createElement("div");
    c.className = "coriandoli";
    const colori = ["#e6b24a", "#f7efe2", "#c8102e", "#86b64a", "#edcf94"];
    for (let i = 0; i < 70; i++) {
      const p = document.createElement("i");
      p.style.left = Math.random() * 100 + "%";
      p.style.background = colori[i % colori.length];
      p.style.animationDelay = Math.random() * .6 + "s";
      p.style.animationDuration = 2.2 + Math.random() * 1.4 + "s";
      c.appendChild(p);
    }
    document.body.appendChild(c);
    setTimeout(function () { c.remove(); }, 4500);
  }

  function linkClub() { return "./?club=apri" + (DEMO ? "&demo=1" : ""); }
  function mostraPremio(g, nuovo) {
    const socio = !!leggi(CHIAVE);
    let riscatto;
    if (g.codice) {
      riscatto = '<div class="riscatto fatto"><h3>' + esc(t("fattoTit")) + "</h3><p>" + esc(t("fattoSub")) + "</p>" +
        '<a class="btn" href="' + linkClub() + '">' + esc(t("apri")) + "</a></div>";
    } else if (socio) {
      riscatto = '<div class="riscatto"><h3>' + esc(t("socioTit")) + "</h3><p>" + esc(t("socioSub")) + "</p>" +
        '<a class="btn pulsa" href="' + linkClub() + '">' + esc(t("socioBtn")) + "</a></div>";
    } else {
      riscatto = '<div class="riscatto"><h3>' + esc(t("lucchettoTit")) + "</h3><p>" + esc(t("lucchettoSub")) + "</p>" +
        '<a class="btn pulsa" href="' + linkClub() + '">' + esc(t("entraBtn")) + "</a></div>";
    }
    gioco.innerHTML =
      '<div class="premio">' + (nuovo ? "" : '<p class="gia">' + esc(t("gia")) + "</p>") +
      '<div class="vinto">' + esc(t("vinto")) + "</div>" +
      '<div class="emo">' + esc(g.emoji) + "</div>" +
      "<h2>" + esc(inLingua(g.nome)) + "</h2>" +
      '<p class="descr">' + esc(inLingua(g.descr)) + "</p>" +
      '<div class="vale">⏰ ' + esc(t("vale", { ora: g.chiusura || "23:30" })) + "</div>" +
      "</div>" + riscatto;
    if (nuovo) coriandoli();
  }

  function avviso(emoji, titolo, testo, riprova) {
    gioco.innerHTML = '<div class="avviso"><div class="emo">' + emoji + "</div><h2>" + esc(titolo) + "</h2><p>" + esc(testo) + "</p>" +
      (riprova ? '<button type="button" class="btn" id="riprova">' + esc(t("riprova")) + "</button>" : "") + "</div>";
    const b = $("#riprova");
    if (b) b.addEventListener("click", avvia);
  }

  async function avvia() {
    gioco.innerHTML = '<div class="carico" aria-hidden="true"></div><p class="didascalia">' + esc(t("carico")) + "</p>";
    let g;
    try {
      g = await gioca();
    } catch (e) {
      if (e.codice === "riposo") return avviso("😴", t("riposoTit"), t("riposoSub"));
      if (e.codice === "chiuso") return avviso("🌙", t("chiusoTit"), t("chiusoSub"));
      return avviso("📶", t("erroreTit"), t("erroreSub"), true);
    }
    // il conto alla rovescia solo a chi gioca per la prima volta stasera; chi torna rivede il suo premio
    if (g.nuovo) await contoAllaRovescia();
    // si ricorda la giocata: serve al Club (club.js) per mettere il premio nella tessera
    scrivi(FORTUNA, JSON.stringify({ segreto: g.segreto, sera: g.sera, premio: g.premio, emoji: g.emoji, nome: g.nome,
      descr: g.descr, persone: g.persone, codice: g.codice || (salvato() && salvato().segreto === g.segreto && salvato().codice) || null,
      chiusura: g.chiusura }));
    mostraPremio(salvato(), !!g.nuovo);
  }
  avvia();
})();
</script>
</body>
</html>
