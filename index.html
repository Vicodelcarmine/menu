<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3a1f1a" />
  <title>Vico del Carmine — Osteria pizzeria napoletana</title>
  <meta name="description" content="Menu di Vico del Carmine — Osteria pizzeria napoletana a Firenze. Specialità di mare, pizze e cucina napoletana. Menu in 9 lingue." />

  <!-- App installabile su telefono (PWA) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vico del Carmine" />

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Oswald:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- INTRO: animazione del logo all'apertura (si può saltare toccando) -->
  <div id="intro" class="intro" role="dialog" aria-label="Intro">
    <video id="intro-video" class="intro-video" playsinline muted autoplay preload="auto" poster="assets/media/logo.jpg">
      <source src="assets/media/intro.mp4" type="video/mp4" />
    </video>
    <button id="intro-skip" class="intro-skip">Tocca per entrare</button>
  </div>

  <!-- SELETTORE LINGUA -->
  <button id="lang-btn" class="lang-btn" aria-haspopup="true" aria-expanded="false">
    <span class="lang-globe" id="lang-cur-flag">🌐</span><span id="lang-cur">IT</span><span class="lang-caret">▾</span>
  </button>
  <div id="lang-panel" class="lang-panel" role="menu" aria-hidden="true">
    <p class="lang-panel-title" id="lang-title">Scegli la lingua</p>
    <div class="lang-list" id="lang-list"></div>
  </div>

  <main class="wrap">

    <!-- Intestazione -->
    <header class="hero">
      <p class="kicker" id="r-kicker">Cucina napoletana · Firenze</p>
      <h1 class="hero-title"><img class="hero-logo" id="hero-logo" src="assets/media/logo.jpg" alt="Vico del Carmine — Osteria pizzeria napoletana" /></h1>
      <div class="flame-rule"></div>
      <p class="sub" id="r-sub">Osteria pizzeria napoletana</p>
    </header>

    <!-- Griglia categorie: 2 colonne -->
    <nav class="menu-grid" id="grid" aria-label="Categorie del menu"></nav>

    <!-- Piè di pagina -->
    <footer class="foot">
      <span class="name" id="f-name">Vico del Carmine</span>
      <div id="f-addr"><a id="f-addr-link" href="#" target="_blank" rel="noopener">Via Pisana 40/r, Firenze</a></div>
      <div class="foot-note" id="f-note"></div>
    </footer>
  </main>

  <!-- Specialità: sotto-menu -->
  <div class="overlay spec" id="spec-overlay" role="dialog" aria-modal="true" aria-label="Specialità della casa">
    <button class="ov-close" id="spec-close" aria-label="Chiudi">✕</button>
    <div class="spec-inner">
      <header class="spec-head">
        <span class="spec-kicker" id="spec-kicker">✦ Le specialità della casa ✦</span>
        <h2 id="spec-title">Specialità</h2>
        <p id="spec-sub">Il meglio della nostra cucina napoletana</p>
      </header>
      <div class="spec-cards" id="spec-cards"></div>
    </div>
  </div>

  <!-- Carosello a schermo intero -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Piatti">
    <button class="ov-close" id="ov-close" aria-label="Chiudi">✕</button>

    <div class="ov-top">
      <h2 class="ov-title" id="ov-title">Categoria</h2>
      <span class="ov-count" id="ov-count">1 / 1</span>
    </div>

    <div class="deck" id="deck"></div>

    <button class="nav-btn nav-prev" id="nav-prev" aria-label="Precedente">‹</button>
    <button class="nav-btn nav-next" id="nav-next" aria-label="Successivo">›</button>

    <div class="ov-bottom">
      <div class="dots" id="dots"></div>
      <div class="hint" id="ov-hint">Scorri · tocca · trascina</div>
    </div>
  </div>

  <!-- Tasto nascosto per modificare il menu (tieni premuto 5 secondi) -->
  <div id="notif-hotspot" aria-hidden="true">
    <div id="notif-ring"></div>
  </div>
  <!-- Password -->
  <div class="approve-modal" id="pw-modal" role="dialog" aria-modal="true">
    <div class="approve-box" id="pw-box"></div>
  </div>
  <!-- Editor (prezzi e foto) -->
  <div class="overlay sheet" id="edit-overlay" role="dialog" aria-modal="true" aria-label="Modifica menu">
    <button class="ov-close" id="edit-close" aria-label="Chiudi">✕</button>
    <div class="sheet-inner" id="edit-inner"></div>
  </div>

  <!-- Dati del menu (9 lingue) -->
  <script src="assets/js/menu-data.js"></script>
  <!-- Traduzioni dell'interfaccia -->
  <script src="assets/js/i18n.js"></script>
  <!-- Magazzino dati (Supabase — da collegare) -->
  <script src="assets/js/store.js"></script>
  <!-- Logica -->
  <script src="assets/js/app.js"></script>
</body>
</html>
